[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/foods.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The app's own addresses all load the single page; the page reads the path.
# Listed explicitly (no catch-all) so /api, /mcp, and data files are untouched.
[[redirects]]
  from = "/foods"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/builder"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/community"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/community/*"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/recipes"
  to = "/index.html"
  status = 200
[[redirects]]
  from = "/recipes/*"
  to = "/index.html"
  status = 200
